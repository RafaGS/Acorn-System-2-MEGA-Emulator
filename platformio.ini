[platformio]
default_envs = mega2560

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_echo = no
; Si cambias SYS2_BAUD cambia tambien monitor_speed.
build_flags =
    -Iinclude
    -Wall
    -Wextra
    -DSYS2_BAUD=115200
    ; -DSYS2_EXT_RAM_KB=2
    ; -DSYS2_MOSAIC_STYLE=0
    ; -DSYS2_ASCII_ONLY=1
